<aside class="w-64 glass-panel flex flex-col hidden md:flex h-full z-20 border-r border-white/60" th:fragment="sidebar(active)">
    <div class="p-6 flex items-center gap-3 border-b border-white/50">
        <div class="bg-primary-600 text-white p-2 rounded-lg shadow-md">
            <i class="fa-solid fa-jug-detergent text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-primary-700 tracking-wider">CeceWash</h1>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
        <a th:href="@{/laundry}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all" th:classappend="${active == 'dashboard'} ? 'bg-white/60 text-primary-700 font-semibold shadow-sm border border-white/50' : 'hover:bg-white/40 text-gray-600 font-medium'">
            <i class="fa-solid fa-chart-pie w-5"></i>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/laundry/tambah}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all" th:classappend="${active == 'add'} ? 'bg-white/60 text-primary-700 font-semibold shadow-sm border border-white/50' : 'hover:bg-white/40 text-gray-600 font-medium'">
            <i class="fa-solid fa-plus-circle w-5"></i>
            <span>Tambah Pesanan</span>
        </a>
    </nav>

    <div class="p-4 border-t border-white/50 flex items-center gap-3 bg-white/20">
        <img src="https://ui-avatars.com/api/?name=Admin+Laundry&background=0D9488&color=fff" alt="Admin" class="w-10 h-10 rounded-full shadow-sm">
        <div>
            <p class="text-sm font-semibold text-gray-800">Admin Laundry</p>
            <p class="text-xs text-gray-500">Petugas</p>
        </div>
    </div>
</aside>
